
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Gatos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .gato-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .gato-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .gato-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eeeeee;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 180px;
      margin-top: 10px;
      border-radius: 8px;
    }

    #resultado {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #6c757d;
    }

    .titulo-seccion {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="container-fluid py-4 px-3 px-md-4">
    <div class="row g-4">

      <!-- FORMULARIO -->
      <section class="col-12 col-lg-4">
        <div class="card p-4">
          <h2 class="text-center mb-4 titulo-seccion">
            Registro de Gato
          </h2>

          <form id="formGato">
            <input type="hidden" id="gatoId">

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                required
                maxlength="100"
                placeholder="Ej: Michi"
              >
            </div>

            <div class="mb-3">
              <label for="edad" class="form-label">Edad (años)</label>
              <input
                type="number"
                class="form-control"
                id="edad"
                required
                min="0"
                step="0.1"
                placeholder="Ej: 2.5"
              >
            </div>

            <div class="mb-3">
              <label for="peso" class="form-label">Peso (kg)</label>
              <input
                type="number"
                class="form-control"
                id="peso"
                required
                min="0.1"
                step="0.1"
                placeholder="Ej: 4.2"
              >
            </div>

            <div class="mb-3">
              <label for="raza" class="form-label">Raza</label>
              <input
                type="text"
                class="form-control"
                id="raza"
                required
                maxlength="100"
                placeholder="Ej: Siamés"
              >
            </div>

            <div class="mb-3">
              <label for="imagen" class="form-label">
                Imagen del gato
              </label>

              <input
                type="file"
                class="form-control"
                id="imagen"
                accept="image/*"
              >

              <img id="preview" alt="Vista previa de la imagen">

              <small class="text-muted d-block mt-2" id="ayudaImagen">
                La imagen es obligatoria al registrar un gato nuevo.
                Al editar, podés conservar la imagen actual.
              </small>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              id="btnSubmit"
            >
              Registrar Gato
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary w-100 mt-2 d-none"
              id="btnCancelar"
            >
              Cancelar edición
            </button>
          </form>

          <div
            id="resultado"
            class="alert mt-4"
            role="alert"
            aria-live="polite"
          ></div>
        </div>
      </section>

      <!-- LISTA DE GATOS -->
      <section class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
          <h2 class="mb-0 titulo-seccion">Gatos Registrados</h2>

          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            id="btnRecargar"
          >
            Actualizar
          </button>
        </div>

        <div id="listaGatos" class="row g-3">
          <div class="col-12 loading">Cargando gatos...</div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // URL base del backend. No agregar /gato ni /gatos aquí.
    const BACKEND_URL = "https://gatos-backend.onrender.com";

    // Imagen de respaldo creada localmente; no depende de otro servidor.
    const IMAGEN_RESPALDO =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="600" height="360" viewBox="0 0 600 360">
          <rect width="600" height="360" fill="#eeeeee"/>
          <g fill="#9ca3af">
            <circle cx="300" cy="145" r="55"/>
            <path d="M245 115 L230 60 L275 91 Z"/>
            <path d="M325 91 L370 60 L355 115 Z"/>
            <ellipse cx="300" cy="225" rx="85" ry="58"/>
          </g>
          <text x="300" y="320"
                font-family="Arial,sans-serif"
                font-size="25"
                text-anchor="middle"
                fill="#555">
            Sin imagen disponible
          </text>
        </svg>
      `);

    const $ = (id) => document.getElementById(id);

    let gatosCargados = [];

    // Escapa los datos antes de introducirlos en el HTML.
    function escaparHTML(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, (caracter) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caracter]);
    }

    // Evita utilizar valores vacíos o inválidos como direcciones de imagen.
    function obtenerImagenSegura(valor) {
      if (
        typeof valor !== "string" ||
        !valor.trim() ||
        valor.trim() === "undefined" ||
        valor.trim() === "null"
      ) {
        return IMAGEN_RESPALDO;
      }

      try {
        const url = new URL(valor);

        if (
          url.protocol !== "https:" &&
          url.protocol !== "http:" &&
          url.protocol !== "data:"
        ) {
          return IMAGEN_RESPALDO;
        }

        if (
          url.protocol === "data:" &&
          !valor.startsWith("data:image/")
        ) {
          return IMAGEN_RESPALDO;
        }

        return valor;
      } catch {
        return IMAGEN_RESPALDO;
      }
    }

    // Convierte diferentes formatos de fecha a una fecha legible.
    function formatearFecha(valor) {
      if (!valor) return "No disponible";

      let fechaValor = valor;

      // Firestore puede devolver la fecha como un objeto con _seconds.
      if (typeof valor === "object" && valor !== null) {
        if (typeof valor.toDate === "function") {
          fechaValor = valor.toDate();
        } else if (typeof valor._seconds === "number") {
          fechaValor = valor._seconds * 1000;
        } else if (typeof valor.seconds === "number") {
          fechaValor = valor.seconds * 1000;
        } else {
          return "No disponible";
        }
      }

      const fecha = new Date(fechaValor);

      if (Number.isNaN(fecha.getTime())) {
        return "No disponible";
      }

      return fecha.toLocaleDateString("es-NI");
    }

    function mostrarResultado(mensaje, tipo = "success", imagenUrl = "") {
      const resultado = $("resultado");

      resultado.className = `alert alert-${tipo} mt-4`;
      resultado.replaceChildren();

      const texto = document.createElement("div");
      texto.textContent = mensaje || "";
      resultado.appendChild(texto);

      if (imagenUrl) {
        const img = document.createElement("img");

        img.src = obtenerImagenSegura(imagenUrl);
        img.alt = "Imagen del gato";
        img.style.cssText =
          "max-width:100%;max-height:220px;margin-top:10px;border-radius:8px;";

        img.addEventListener("error", () => {
          img.onerror = null;
          img.src = IMAGEN_RESPALDO;
        }, { once: true });

        resultado.appendChild(img);
      }

      resultado.style.display = "block";
    }

    // Vista previa de la imagen seleccionada.
    $("imagen").addEventListener("change", (evento) => {
      const archivo = evento.target.files?.[0];
      const preview = $("preview");

      if (!archivo) {
        preview.removeAttribute("src");
        preview.style.display = "none";
        return;
      }

      if (!archivo.type.startsWith("image/")) {
        evento.target.value = "";
        preview.removeAttribute("src");
        preview.style.display = "none";

        mostrarResultado(
          "Seleccioná un archivo de imagen válido.",
          "danger"
        );
        return;
      }

      if (preview.dataset.objectUrl) {
        URL.revokeObjectURL(preview.dataset.objectUrl);
      }

      const objectUrl = URL.createObjectURL(archivo);

      preview.dataset.objectUrl = objectUrl;
      preview.src = objectUrl;
      preview.style.display = "block";
    });

    // Registrar o actualizar un gato.
    $("formGato").addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const gatoId = $("gatoId").value.trim();
      const esEdicion = gatoId !== "";
      const inputImagen = $("imagen");
      const boton = $("btnSubmit");

      const nombre = $("nombre").value.trim();
      const edad = $("edad").value;
      const peso = $("peso").value;
      const raza = $("raza").value.trim();

      if (!nombre || !raza || edad === "" || peso === "") {
        mostrarResultado(
          "Completá todos los campos obligatorios.",
          "danger"
        );
        return;
      }

      if (Number(edad) < 0 || Number(peso) <= 0) {
        mostrarResultado(
          "La edad no puede ser negativa y el peso debe ser mayor que cero.",
          "danger"
        );
        return;
      }

      if (!esEdicion && inputImagen.files.length === 0) {
        mostrarResultado(
          "La imagen es obligatoria al registrar un gato nuevo.",
          "danger"
        );
        return;
      }

      const formData = new FormData();

      formData.append("nombre", nombre);
      formData.append("edad", edad);
      formData.append("peso", peso);
      formData.append("raza", raza);

      if (inputImagen.files.length > 0) {
        // Este nombre debe coincidir con el campo configurado en Multer.
        formData.append("imagen", inputImagen.files[0]);
      }

      boton.disabled = true;
      $("btnCancelar").disabled = true;
      boton.textContent = esEdicion
        ? "Actualizando..."
        : "Registrando...";

      try {
        const url = esEdicion
          ? `${BACKEND_URL}/gato/${encodeURIComponent(gatoId)}`
          : `${BACKEND_URL}/gato`;

        const respuesta = await fetch(url, {
          method: esEdicion ? "PUT" : "POST",
          body: formData
        });

        const data = await respuesta.json().catch(() => ({}));

        if (!respuesta.ok) {
          throw new Error(
            data.mensaje ||
            data.error ||
            `Error del servidor: ${respuesta.status}`
          );
        }

        // Guardar el mensaje antes de limpiar el formulario.
        const mensaje = data.mensaje ||
          (esEdicion
            ? "Gato actualizado correctamente."
            : "Gato registrado correctamente.");

        const imagenGuardada = data.imagenUrl || "";

        limpiarFormulario(false);

        mostrarResultado(mensaje, "success", imagenGuardada);

        await cargarGatos();
      } catch (error) {
        console.error("Error al guardar el gato:", error);

        mostrarResultado(
          error.message ||
          "No se pudo conectar con el servidor. Revisá el backend.",
          "danger"
        );
      } finally {
        boton.disabled = false;
        $("btnCancelar").disabled = false;

        boton.textContent = $("gatoId").value
          ? "Actualizar Gato"
          : "Registrar Gato";
      }
    });

    // Cargar un gato existente en el formulario.
    function editarGato(id) {
      const gato = gatosCargados.find(
        (item) => String(item.id) === String(id)
      );

      if (!gato) {
        mostrarResultado(
          "No se encontró el gato. Actualizá la lista e intentá nuevamente.",
          "danger"
        );
        return;
      }

      $("gatoId").value = gato.id ?? "";
      $("nombre").value = gato.nombre ?? "";
      $("edad").value = gato.edad ?? "";
      $("peso").value = gato.peso ?? "";
      $("raza").value = gato.raza ?? "";
      $("imagen").value = "";

      $("preview").style.display = "none";
      $("preview").removeAttribute("src");

      $("btnSubmit").textContent = "Actualizar Gato";
      $("btnCancelar").classList.remove("d-none");

      $("ayudaImagen").textContent =
        "Si no seleccionás una nueva imagen, se conserva la actual.";

      $("resultado").style.display = "none";

      $("formGato").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // Restablecer el formulario.
    function limpiarFormulario(ocultarMensaje = true) {
      $("formGato").reset();
      $("gatoId").value = "";

      const preview = $("preview");

      if (preview.dataset.objectUrl) {
        URL.revokeObjectURL(preview.dataset.objectUrl);
        delete preview.dataset.objectUrl;
      }

      preview.removeAttribute("src");
      preview.style.display = "none";

      $("btnCancelar").classList.add("d-none");
      $("btnSubmit").textContent = "Registrar Gato";

      $("ayudaImagen").textContent =
        "La imagen es obligatoria al registrar un gato nuevo. Al editar, podés conservar la imagen actual.";

      if (ocultarMensaje) {
        $("resultado").style.display = "none";
      }
    }

    $("btnCancelar").addEventListener("click", () => {
      limpiarFormulario();
    });

    // Consultar y mostrar los gatos registrados.
    async function cargarGatos() {
      const contenedor = $("listaGatos");

      contenedor.innerHTML =
        '<div class="col-12 loading">Cargando gatos...</div>';

      try {
        const respuesta = await fetch(`${BACKEND_URL}/gatos`);

        const data = await respuesta.json().catch(() => null);

        if (!respuesta.ok) {
          throw new Error(
            data?.mensaje ||
            data?.error ||
            `Error del servidor: ${respuesta.status}`
          );
        }

        if (!Array.isArray(data)) {
          throw new Error(
            "El endpoint /gatos no devolvió una lista válida."
          );
        }

        gatosCargados = data;

        if (data.length === 0) {
          contenedor.innerHTML = `
            <div class="col-12">
              <div class="alert alert-info text-center">
                Aún no hay gatos registrados.
              </div>
            </div>
          `;
          return;
        }

        contenedor.innerHTML = data.map((gato, indice) => {
          const nombre = escaparHTML(gato.nombre || "Gato sin nombre");
          const raza = escaparHTML(gato.raza || "Raza no especificada");
          const edad = escaparHTML(gato.edad ?? "N/D");
          const peso = escaparHTML(gato.peso ?? "N/D");
          const fecha = escaparHTML(formatearFecha(gato.fecha));
          const imagen = escaparHTML(
            obtenerImagenSegura(gato.imagenUrl)
          );

          return `
            <div class="col-12 col-sm-6 col-xl-4">
              <article class="card gato-card h-100">
                <img
                  src="${imagen}"
                  class="gato-img"
                  alt="${nombre}"
                  loading="lazy"
                >

                <div class="card-body d-flex flex-column">
                  <h5 class="card-title mb-1">${nombre}</h5>

                  <p class="card-text mb-1">
                    <small class="text-muted">
                      ${raza} · ${edad} años · ${peso} kg
                    </small>
                  </p>

                  <p class="card-text">
                    <small class="text-muted">
                      Registrado: ${fecha}
                    </small>
                  </p>

                  <div class="mt-auto d-flex gap-2">
                    <button
                      type="button"
                      class="btn btn-sm btn-outline-primary flex-fill"
                      data-accion="editar"
                      data-indice="${indice}"
                    >
                      Actualizar
                    </button>

                    <button
                      type="button"
                      class="btn btn-sm btn-outline-danger flex-fill"
                      data-accion="eliminar"
                      data-indice="${indice}"
                    >
                      Eliminar
                    </button>
                  </div>
                </div>
              </article>
            </div>
          `;
        }).join("");

        // Si falla la imagen original, usar la imagen local de respaldo.
        contenedor.querySelectorAll(".gato-img").forEach((img) => {
          img.addEventListener("error", () => {
            img.onerror = null;
            img.src = IMAGEN_RESPALDO;
          }, { once: true });
        });

      } catch (error) {
        console.error("Error al cargar los gatos:", error);

        contenedor.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger text-center">
              No se pudieron cargar los gatos.
              ${escaparHTML(error.message || "Revisá la conexión con el backend.")}
            </div>
          </div>
        `;
      }
    }

    // Delegación de eventos para los botones de las tarjetas.
    $("listaGatos").addEventListener("click", (evento) => {
      const boton = evento.target.closest("button[data-accion]");

      if (!boton) return;

      const indice = Number(boton.dataset.indice);
      const gato = gatosCargados[indice];

      if (!gato) {
        mostrarResultado(
          "No se encontraron los datos del gato seleccionado.",
          "danger"
        );
        return;
      }

      if (boton.dataset.accion === "editar") {
        editarGato(gato.id);
      }

      if (boton.dataset.accion === "eliminar") {
        eliminarGato(gato.id, gato.nombre);
      }
    });

    // Eliminar un gato.
    async function eliminarGato(id, nombre) {
      if (!id) {
        alert("No se encontró el identificador del gato.");
        return;
      }

      const confirmar = confirm(
        `¿Estás seguro de eliminar a "${nombre || "este gato"}"?`
      );

      if (!confirmar) return;

      try {
        const respuesta = await fetch(
          `${BACKEND_URL}/gato/${encodeURIComponent(id)}`,
          { method: "DELETE" }
        );

        const data = await respuesta.json().catch(() => ({}));

        if (!respuesta.ok) {
          throw new Error(
            data.mensaje ||
            data.error ||
            `Error del servidor: ${respuesta.status}`
          );
        }

        alert(data.mensaje || "Gato eliminado correctamente.");

        await cargarGatos();
      } catch (error) {
        console.error("Error al eliminar el gato:", error);

        alert(
          error.message ||
          "No se pudo conectar con el servidor."
        );
      }
    }

    // Botón para actualizar la lista manualmente.
    $("btnRecargar").addEventListener("click", cargarGatos);

    // Cargar los registros al abrir la página.
    cargarGatos();
  </script>
</body>
</html>
